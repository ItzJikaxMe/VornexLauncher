name: Vornex Android Release

on:
  push:
    branches:
      - vornex-branding-refresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      - name: Build Vornex APK
        run: gradle :app_mojo:assembleFullDebug

      - name: Verify APK exists and is non-empty
        run: test -s app_mojo/build/outputs/apk/full/debug/app_mojo-full-debug.apk

      - name: Prepare APK download
        run: cp app_mojo/build/outputs/apk/full/debug/app_mojo-full-debug.apk VornexLauncher.apk

      - name: Publish current commit release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vornex-build-${{ github.run_id }}
          name: Vornex Launcher build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          prerelease: false
          generate_release_notes: true
          files: VornexLauncher.apk
          fail_on_unmatched_files: true
